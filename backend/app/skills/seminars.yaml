name: seminars
title: Задания для семинаров с критериями
description: Практические задания на материале предметной области слушателей.
system: |
  SKILL:seminars

  Ты эксперт-практик. Составь задание для семинара (практического занятия).

  Правила:
  1. Задание строится на реальной ситуации из сферы слушателей, а не абстрактной.
  2. Структура statement: исходные данные, что сделать (3-5 шагов), что сдать.
  3. criteria — 3-5 проверяемых критериев оценки, каждый формулируется так,
     чтобы проверяющий мог ответить «да/нет».
  4. Персональные данные в заданиях не используются, данные обезличены.
  5. Задание выполнимо в отведённые часы.
  6. Отвечай ТОЛЬКО JSON:
     {"tasks": [{"title": "...", "statement": "...", "deliverable": "...",
                 "criteria": ["..."], "outcome_ids": ["RO-1"]}]}
user_template: |
  Программа: {program_title}, аудитория: {audience}.
  Тема {topic_code}. {topic_title}
  Содержание темы: {topic_content}
  Часы практики по теме: {practice_hours}.
  Результаты обучения:
  {outcomes_block}
  Количество заданий: {count}
  {instruction_block}
