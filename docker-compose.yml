services:
  backend:
    build: ./backend
    environment:
      # Пусто — провайдер выбирается сам: есть ключ и модель → живая модель,
      # иначе офлайн-заглушка. mock — принудительно без обращения к модели.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Среда хакатона кладёт доступы в OPENAI_*; config.py примет оба написания
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-}
      # Задержка офлайн-демо, мс: иначе прогресс генерации не успевает показаться
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
      PRICE_PROMPT_PER_1K: ${PRICE_PROMPT_PER_1K:-0.20}
      PRICE_COMPLETION_PER_1K: ${PRICE_COMPLETION_PER_1K:-0.60}
      DATA_DIR: /app/data
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-3100}:80"
