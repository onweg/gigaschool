services:
  backend:
    build: ./backend
    environment:
      # Пусто — провайдер выбирается сам: есть ключ и модель → живая модель,
      # иначе офлайн-заглушка. mock — принудительно без обращения к модели.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Среда хакатона кладёт доступы в OPENAI_*; config.py примет оба написания
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-}
      # Адрес модели ограничен списком (кейс допускает только Cloud.ru).
      # Другой шлюз разрешается конкретным доменом, выключателя проверки нет.
      LLM_EXTRA_HOSTS: ${LLM_EXTRA_HOSTS:-}
      # Сколько запросов к модели одновременно: шлюз площадки держит 2.
      LLM_MAX_PARALLEL: ${LLM_MAX_PARALLEL:-2}
      # 1 — повторные одинаковые запросы берутся с диска, режим отладки.
      LLM_CACHE: ${LLM_CACHE:-0}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      # Задержка офлайн-демо, мс: иначе прогресс генерации не успевает показаться
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
      PRICE_PROMPT_PER_1K: ${PRICE_PROMPT_PER_1K:-0.20}
      PRICE_COMPLETION_PER_1K: ${PRICE_COMPLETION_PER_1K:-0.60}
      # Сколько стоит час методиста и сколько часов уходит на программу вручную —
      # из этого считается экономия, которую кейс просит показать на защите.
      METHODIST_HOUR_COST: ${METHODIST_HOUR_COST:-800}
      MANUAL_HOURS_PER_PROGRAM: ${MANUAL_HOURS_PER_PROGRAM:-60}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Телеметрия закрыта токеном: в ней запросы методистов и стоимость.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATA_DIR: /app/data
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-3100}:80"
