server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API проксируется на backend — единый origin, без CORS в браузере
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Выгрузка комплекта и SSE-прогресс не должны обрываться по таймауту
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }
}
